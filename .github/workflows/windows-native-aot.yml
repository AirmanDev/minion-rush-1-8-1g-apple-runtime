name: Windows native AOT compiler checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-aot:
    name: Native translator build and synthetic ELF test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Locate host Clang
        shell: pwsh
        run: |
          "$Env:ProgramFiles\LLVM\bin" >> $Env:GITHUB_PATH
      - name: Compile and test translator (no game files)
        shell: pwsh
        run: |
          clang --version
          python -m unittest discover -s tests -p test_native_aot.py -v
