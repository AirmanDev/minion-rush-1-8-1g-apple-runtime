name: Windows native AOT compiler checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-aot:
    name: Native translator build and synthetic ELF test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Locate host Clang
        shell: pwsh
        run: |
          "$Env:ProgramFiles\LLVM\bin" >> $Env:GITHUB_PATH
      - name: Compile and test translator (no game files)
        shell: pwsh
        run: |
          clang --version
          python tools/build_builder_palette.py --check
          python -m unittest discover -s tests -p test_native_aot.py -v
          python -m unittest discover -s tests -p test_native_ipa.py -v
          python -m unittest discover -s tests -p test_windows_native.py -v
          python -m unittest discover -s tests -p test_localization_optional.py -v

      - name: Validate isolated portable Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'minion-native-kit-ci'
          New-Item -ItemType Directory -Path $temp | Out-Null
          $pyzip = Join-Path $temp 'python-3.14.7-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip' -OutFile $pyzip
          $sha = (Get-FileHash $pyzip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd297e5ff019966817ad8502465176139f2d3d840fa4ed84b13bed399a6ab1f15') {
            throw 'Embedded Python download digest mismatch'
          }
          $compiler = Join-Path $temp 'a64-compiler.exe'
          clang -std=c11 -O2 -D_CRT_SECURE_NO_WARNINGS -DMR_ELF_BUILD_TOOLS -Isrc/native -o $compiler src/native/a64_compiler.c src/native/elf_loader.c
          if ($LASTEXITCODE -ne 0) { throw 'Windows AOT compiler build failed' }
          $gui = Join-Path $temp 'MinionRush Builder.exe'
          $vswhere = Join-Path (Join-Path $env:SystemDrive 'Program Files (x86)') 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C toolchain not found' }
          $vsdevcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $resource = Join-Path $temp 'MinionRush-builder-icon.res'
          $rcCommand = 'call "' + $vsdevcmd + '" -no_logo -arch=amd64 && rc /nologo /fo"' + $resource + '" src\windows\builder.rc'
          & cmd.exe /d /s /c $rcCommand
          if ($LASTEXITCODE -ne 0) { throw 'Windows icon resource build failed' }
          $command = 'call "' + $vsdevcmd + '" -no_logo -arch=amd64 && cl /nologo /std:c11 /O2 /W4 /WX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /Fe:"' + $gui + '" src\windows\ipa_builder.c "' + $resource + '" /link /SUBSYSTEM:WINDOWS user32.lib ole32.lib uuid.lib comctl32.lib shell32.lib gdi32.lib comdlg32.lib'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI C build failed' }
          $testGui = Join-Path $temp 'MinionRush Builder UTM test.exe'
          $testCommand = 'call "' + $vsdevcmd + '" -no_logo -arch=amd64 && cl /nologo /std:c11 /O2 /W4 /WX /DUNICODE /D_UNICODE /DMR_UTM_TEST /D_WIN32_WINNT=0x0A00 /Fe:"' + $testGui + '" src\windows\ipa_builder.c "' + $resource + '" /link /SUBSYSTEM:WINDOWS user32.lib ole32.lib uuid.lib comctl32.lib shell32.lib gdi32.lib comdlg32.lib'
          & cmd.exe /d /s /c $testCommand
          if ($LASTEXITCODE -ne 0) { throw 'Windows UTM test GUI C build failed' }
          $launcher = Join-Path $temp 'MinionRush Portable.exe'
          $launcherCommand = 'call "' + $vsdevcmd + '" -no_logo -arch=amd64 && cl /nologo /std:c11 /O2 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /Fe:"' + $launcher + '" src\windows\onefile_launcher.c "' + $resource + '" /link /SUBSYSTEM:WINDOWS user32.lib ole32.lib shell32.lib advapi32.lib'
          & cmd.exe /d /s /c $launcherCommand
          if ($LASTEXITCODE -ne 0) { throw 'Windows one-file launcher build failed' }
          python tools/verify_windows_icon.py --ico src/windows/builder.ico $gui $testGui $launcher
          if ($LASTEXITCODE -ne 0) { throw 'Windows application icon verification failed' }
          $template = Join-Path $temp 'unsigned-test-template.zip'
          [System.IO.File]::WriteAllBytes($template, [byte[]](1, 2, 3))
          $kit = Join-Path $temp 'kit'
          python tools/build_windows_kit.py --python-embed-zip $pyzip --compiler $compiler --gui-exe $gui --template $template --output $kit
          if ($LASTEXITCODE -ne 0) { throw 'Portable kit assembly failed' }
          $utmKit = Join-Path $temp 'utm-kit'
          python tools/build_windows_kit.py --mode utm-test --python-embed-zip $pyzip --compiler $compiler --gui-exe $testGui --template $template --output $utmKit
          if ($LASTEXITCODE -ne 0) { throw 'UTM test kit assembly failed' }
          & (Join-Path $utmKit 'MinionRush Builder.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'UTM test GUI startup check failed' }
          if (Test-Path (Join-Path $kit 'runtime\tools\windows_utm_transport.py')) { throw 'Release kit includes UTM support' }
          if (-not (Test-Path (Join-Path $utmKit 'runtime\tools\windows_utm_transport.py'))) { throw 'UTM test kit missing transport module' }
          $releaseManifest = Get-Content (Join-Path $kit 'kit-manifest.json') -Raw | ConvertFrom-Json
          $utmManifest = Get-Content (Join-Path $utmKit 'kit-manifest.json') -Raw | ConvertFrom-Json
          if ($releaseManifest.mode -ne 'release' -or $utmManifest.mode -ne 'utm-test') { throw 'Kit profile manifest mismatch' }
          $catalog = Join-Path $temp 'hu.xlf'
          [System.IO.File]::WriteAllText($catalog, 'synthetic CI-only language fixture')
          $privateKit = Join-Path $temp 'private-kit'
          python tools/build_windows_kit.py --mode release --hungarian-xlf $catalog --python-embed-zip $pyzip --compiler $compiler --gui-exe $gui --template $template --output $privateKit
          if ($LASTEXITCODE -ne 0) { throw 'Private-language kit assembly failed' }
          $onefile = Join-Path $temp 'MinionRush-OneFile-CI.exe'
          python tools/build_windows_onefile.py --launcher $launcher --kit $privateKit --output $onefile
          if ($LASTEXITCODE -ne 0) { throw 'One-file package build failed' }
          & $onefile --self-test
          if ($LASTEXITCODE -ne 0) { throw 'One-file native self-extraction/startup failed' }
          $utmOnefile = Join-Path $temp 'MinionRush-UTM-OneFile-CI.exe'
          python tools/build_windows_onefile.py --launcher $launcher --kit $utmKit --output $utmOnefile --allow-test-profile
          if ($LASTEXITCODE -ne 0) { throw 'UTM one-file package build failed' }
          & $utmOnefile --self-test
          if ($LASTEXITCODE -ne 0) { throw 'UTM one-file self-extraction/startup failed' }
          $exe = Join-Path $kit 'python\python.exe'
          & $exe -c 'import windows_native_package; import prepare_native_aot; import native_ipa; print("Embedded runtime imports: PASS")'
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Python import failed' }
          $toolScript = Join-Path (Join-Path (Join-Path $kit 'runtime') 'tools') 'windows_native_package.py'
          & $exe $toolScript --help
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows CLI startup failed' }
          & (Join-Path $kit 'MinionRush Builder.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows GUI startup check failed' }
